name: Release

# Publishes the four images to OCIR on every push to main (F9, D1B, D3C, D11C):
#   build   one OCI layout per image and architecture (arm64 on a native runner, no emulation); no secrets.
#   publish scan, SBOM, push by architecture, combined manifest tagged with the commit SHA.
# Only `publish` sees the registry secrets and runs in the `production` environment. Nothing here
# runs for a pull request, so a change to this file is validated by actionlint and by the
# workflows-permissions test, and exercised for real by the first merge to main.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.image }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
        image: [api, worker, edge, migrator]
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: worker
            dockerfile: apps/worker/Dockerfile
          - image: edge
            dockerfile: apps/web/Dockerfile
          - image: migrator
            dockerfile: packages/db/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.image }} (${{ matrix.arch }}) as an OCI layout
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,tar=false,dest=layouts/${{ matrix.image }}-${{ matrix.arch }}
          cache-from: type=gha,scope=release-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.image }}-${{ matrix.arch }}
          path: layouts/${{ matrix.image }}-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, edge, migrator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ matrix.image }}-*
          path: layouts
      - name: Scan, write the SBOM, push by architecture and combine
        env:
          OCIR_REGISTRY: ${{ vars.OCIR_REGISTRY }}
          OCIR_NAMESPACE: ${{ vars.OCIR_NAMESPACE }}
          OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
          OCIR_TOKEN: ${{ secrets.OCIR_TOKEN }}
          GIT_SHA: ${{ github.sha }}
        run: scripts/ci/publish-image.sh "${{ matrix.image }}"
      - name: Summarise the published digest
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo '```'
            cat "out/${{ matrix.image }}.ref"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ matrix.image }}
          # The reference by digest, the CycloneDX SBOMs and the scan reports.
          path: out/
          retention-days: 90
          if-no-files-found: error
