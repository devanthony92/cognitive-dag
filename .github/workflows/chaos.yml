name: Chaos

# Slow battery that breaks the worker, Temporal, Valkey and PostgreSQL during runs. It is not part
# of the checks of a pull request: it runs by hand and once a week.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chaos:
    name: chaos
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - name: Start infrastructure
        run: docker compose up -d --wait
      - name: Apply database migrations (as app_migrator)
        run: pnpm db:migrate
      - name: Chaos battery
        run: pnpm test:chaos
      - name: Infrastructure logs on failure
        if: failure()
        run: docker compose logs --no-color
