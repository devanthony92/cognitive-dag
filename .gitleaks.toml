title = "CognitiveDAG gitleaks configuration"

[extend]
useDefault = true

# .env.example holds local-only development defaults, never real credentials.
[[allowlists]]
description = "Local development defaults"
paths = ['''^\.env\.example$''']

# Canary values that tests plant to prove content never reaches logs, events or rows.
[[allowlists]]
description = "Test canaries"
condition = "AND"
paths = ['''^apps/[^/]+/test/.*\.test\.ts$''']
regexTarget = "match"
regexes = ['''[A-Z]+-CANARY-\d{4}''']
