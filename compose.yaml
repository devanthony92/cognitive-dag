# Local development infrastructure. Applications run on the host with `pnpm dev`.
# Images are pinned by digest; ports are bound to 127.0.0.1 only.
name: cognitive-dag

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cognitive_dag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-cognitive_dag}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      # Creates the app_migrator and app_runtime roles; runs only on an empty data volume.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.0.7-trixie@sha256:7e1deda01b64ece3167d370ab5be3452d29734feec22cbcbc69b3a64f6859d6d
    ports:
      - '127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_HTTP_HOST_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/temporal:1.9.1@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --ui-ip
      - 0.0.0.0
      - --db-filename
      - /home/temporal/temporal.db
      - --search-attribute
      - CorrelationId=Keyword
    ports:
      - '127.0.0.1:7233:7233'
      - '127.0.0.1:8233:8233'
    volumes:
      # The image runs as a non-root user; its home directory is writable for the SQLite file.
      - temporal-data:/home/temporal
    healthcheck:
      test: ['CMD', 'temporal', 'operator', 'cluster', 'health', '--address', '127.0.0.1:7233']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  valkey-data:
  temporal-data:
