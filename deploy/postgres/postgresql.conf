# PostgreSQL of production (F9, FR-009, ADR-0092). Loaded with `-c config_file=`; the image defaults
# stay for everything not named here. Certificates arrive as Compose secrets (/run/secrets).
listen_addresses = '*'
port = 5432

# TLS is mandatory: pg_hba.conf has hostssl lines only, so a plain connection finds no entry.
ssl = on
ssl_cert_file = '/run/secrets/postgres.crt'
ssl_key_file = '/run/postgres-tls/server.key'
ssl_ca_file = '/run/secrets/ca.crt'
ssl_min_protocol_version = 'TLSv1.3'
password_encryption = scram-sha-256
hba_file = '/etc/postgresql/pg_hba.conf'

# Sized for the 768 MB limit of the container (research.md, memory budget).
shared_buffers = 192MB
effective_cache_size = 384MB
work_mem = 4MB
maintenance_work_mem = 48MB
max_connections = 100

# No archive and no replica: backups are out while only test data exists (constitution 1.1.0).
wal_level = replica
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %u@%d '
