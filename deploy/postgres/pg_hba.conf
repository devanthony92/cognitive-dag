# Only TLS connections, only the three roles, only their databases, only with SCRAM. There is no
# `host` line and no `trust`: a connection without TLS finds no entry and is refused.
# The local line is for the container itself (initialisation and pg_isready); the superuser never
# connects over the network.
local   all                              postgres                       peer
hostssl cognitive_dag                    app_runtime,app_migrator  all  scram-sha-256
hostssl temporal,temporal_visibility     temporal                  all  scram-sha-256
