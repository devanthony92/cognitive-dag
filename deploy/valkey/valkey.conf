# Valkey of production (F9, FR-010, ADR-0092). TLS only, ACL user only, bounded memory.
# The plain port is off: `port 0`. The ACL file is generated at start by entrypoint.sh from the
# secret password, so no hash or password is versioned.
port 0
tls-port 6379
tls-cert-file /run/secrets/valkey.crt
tls-key-file /run/secrets/valkey.key
tls-ca-cert-file /run/secrets/ca.crt
tls-protocols "TLSv1.3"
# Clients authenticate with the ACL user and verify the server with the internal CA; a client
# certificate is not asked of them.
tls-auth-clients no
bind * -::*
# Protected mode would refuse the Compose network; the default user is off and the network is internal.
protected-mode no

aclfile /run/valkey/users.acl

# 128 MB of data inside a 192 MB container. noeviction: when memory is full writes fail and the API
# fails closed (503) instead of dropping rate-limit or session keys.
maxmemory 128mb
maxmemory-policy noeviction

# The data is cache, limits and live events: nothing to persist.
save ""
appendonly no
dir /data
