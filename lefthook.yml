pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{ts,tsx,mjs}'
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    format:
      glob: '*.{ts,tsx,mjs,json,yml,yaml,md}'
      exclude:
        - 'specs/**'
        - '.specify/**'
      run: pnpm exec prettier --check {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
