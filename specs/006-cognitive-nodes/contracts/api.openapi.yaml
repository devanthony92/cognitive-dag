openapi: 3.1.0
info:
  title: CognitiveDAG API — F5 cognitive nodes
  version: 0.6.0
  description: >
    Extiende los contratos de F0–F4 (specs/005-resilience/contracts/api.openapi.yaml). Solo se listan
    los endpoints nuevos o cambiados y los esquemas que cambian. Todos exigen sesión y membresía en la
    organización de la ruta (cualquier rol). Con el flag llm-nodes-enabled apagado, el endpoint nuevo
    responde 404 FEATURE_NOT_AVAILABLE, los campos llmUsage vienen null y los nodos llm.* siguen sin
    ser ejecutables (409 WORKFLOW_NOT_RUNNABLE, como en F3).
servers:
  - url: http://localhost:3000
security:
  - session: []
paths:
  /api/v1/organizations/{organizationId}/llm-usage/today:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: getOrganizationLlmUsageToday
      description: Consumo LLM de la organización en el día UTC actual y el límite vigente.
      responses:
        '200':
          description: Consumo del día
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmDailyUsage' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/organizations/{organizationId}/workflows/{workflowId}/runs/{runId}:
    get:
      description: >
        Sin cambios de ruta. RunDetail gana llmUsage (total de la ejecución) y cada Step gana llmUsage
        (suma de sus llamadas). Los demás endpoints que devuelven Run (listados) no lo incluyen.
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: __Host-session }
  parameters:
    OrganizationId: { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    ErrorClass:
      type: string
      enum: [transient, rate_limited, timeout, permanent, invalid_output, budget_exhausted]
    LlmUsage:
      type: [object, 'null']
      required: [calls, inputTokens, outputTokens, costMicroUsd, repairs]
      properties:
        calls: { type: integer, minimum: 0 }
        model: { type: [string, 'null'], description: Solo en Step; null si hubo varios modelos }
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
        costMicroUsd: { type: integer, minimum: 0, description: Costo estimado en millonésimas de USD }
        repairs: { type: integer, minimum: 0 }
    RunDetail:
      description: RunDetail de F3–F4 con el campo nuevo.
      type: object
      properties:
        llmUsage: { $ref: '#/components/schemas/LlmUsage' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/Step' }
    Step:
      description: Step de F4 con el campo nuevo.
      type: object
      properties:
        llmUsage: { $ref: '#/components/schemas/LlmUsage' }
    LlmDailyUsage:
      type: object
      required: [date, tokensUsed, tokensLimit, costMicroUsd]
      properties:
        date: { type: string, format: date, description: Día UTC }
        tokensUsed: { type: integer, minimum: 0, description: Incluye reservas en curso }
        tokensLimit: { type: integer, minimum: 1 }
        costMicroUsd: { type: integer, minimum: 0 }
    LlmNodeCommonConfig:
      description: >
        Campos nuevos, opcionales, en la configuración de llm.classify, llm.extract y llm.generate
        (DagDefinition de F2). Compatibles hacia atrás.
      type: object
      properties:
        redactPii: { type: boolean, default: false }
        retry: { $ref: '#/components/schemas/RetryPolicy' }
    RetryPolicy:
      description: Igual que en F4 (specs/005-resilience); por defecto 3 intentos, 60 s, 2000 ms en los nodos LLM.
      type: object
      additionalProperties: false
      properties:
        maxAttempts: { type: integer, minimum: 1, maximum: 10 }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 120 }
        initialIntervalMs: { type: integer, minimum: 100, maximum: 30000 }
    Problem:
      type: object
      description: >
        RFC 9457 como en F1–F4. Sin códigos HTTP nuevos. Reutilizados: FEATURE_NOT_AVAILABLE (404, flag
        apagado) y WORKFLOW_NOT_RUNNABLE (409). Los pasos fallidos ganan códigos (research R15):
        LLM_INVALID_OUTPUT, LLM_CONTENT_BLOCKED, LLM_CANARY_LEAK (invalid_output);
        LLM_RUN_BUDGET_EXHAUSTED, LLM_DAILY_BUDGET_EXHAUSTED (budget_exhausted); LLM_INPUT_TOO_LARGE,
        LLM_EMPTY_INPUT, LLM_DISABLED, LLM_PROVIDER_REJECTED (permanent); LLM_PROVIDER_UNAVAILABLE
        (transient); LLM_PROVIDER_RATE_LIMITED (rate_limited).
  responses:
    Problem:
      description: Error RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
