openapi: 3.1.0
info:
  title: CognitiveDAG API — F9 despliegue
  version: 0.10.0
  description: >
    Extiende los contratos de F0–F8 (specs/009-hardening/contracts/api.openapi.yaml). F9 no añade
    endpoints de negocio. Solo se listan los cambios de comportamiento observables detrás de Caddy:
    (1) en producción la API se sirve bajo el mismo origen que la web, en /api/*, por TLS;
    (2) la IP del cliente sale de X-Forwarded-For solo cuando el salto viene del proxy de confianza;
    (3) GET /api/v1/metrics, si D9 lo exige, es interno y no se publica por Caddy;
    (4) condicional a D21A, crear o actualizar una programación con una cron más frecuente que el
    mínimo devuelve 422 CRON_TOO_FREQUENT. Los errores usan application/problem+json (RFC 9457).
servers:
  - url: https://{domain}
    variables:
      domain:
        default: demo.example.invalid
        description: Dominio público de la demo (prerrequisito P2 del autor).
security:
  - session: []
paths:
  /api/v1/health/ready:
    get:
      operationId: getReady
      description: >
        Comprobación de salud que usa el despliegue (FR-024) y el healthcheck de Compose. Sin sesión.
        Informa down sin exponer el error de la dependencia (sin cambios de F1).
      security: []
      responses:
        '200': { description: La API y sus dependencias responden. }
        '503': { description: Una dependencia está caída (sin cuerpo con detalles internos). }
  /api/v1/hooks/{triggerId}/{token}:
    post:
      operationId: receiveWebhook
      description: >
        Sin cambios de comportamiento. Solo por TLS en producción; Caddy redacta el segmento {token} en
        sus registros de acceso (FR-003). La API ya lo redacta en los suyos.
      security: []
      parameters:
        - { name: triggerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Ejecución en cola (sin cambios de F7). }
  /api/v1/organizations/{organizationId}/workflows/{workflowId}/schedules:
    post:
      operationId: createSchedule
      description: >
        Condicional a D21A. Sin cambios salvo el nuevo 422 cuando la cron dispararía con una frecuencia
        menor que SCHEDULE_MIN_INTERVAL_SECONDS (por defecto 300). La misma validación se aplica al
        actualizar y en el reconciliador.
      parameters:
        - { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: workflowId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Programación creada (sin cambios). }
        '422':
          description: Cron demasiado frecuente (solo si D21A).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/CronTooFrequent' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
  schemas:
    CronTooFrequent:
      type: object
      required: [status, title, detail, code, correlationId]
      properties:
        status: { type: integer, const: 422 }
        title: { type: string, const: Unprocessable Content }
        detail: { type: string, description: En español; indica el intervalo mínimo. }
        code: { type: string, const: CRON_TOO_FREQUENT }
        correlationId: { type: string, format: uuid }
        errors:
          type: array
          items: { type: object }
