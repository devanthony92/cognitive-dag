openapi: 3.1.0
info:
  title: CognitiveDAG API — F9 despliegue
  version: 0.10.0
  description: >
    Extiende los contratos de F0–F8 (specs/009-hardening/contracts/api.openapi.yaml). F9 no añade
    endpoints de negocio. Solo se listan los cambios de comportamiento observables detrás de Caddy:
    (1) en producción la API se sirve bajo el mismo origen que la web, en /api/*, por TLS;
    (2) la IP del cliente sale de X-Forwarded-For solo cuando el salto viene del proxy de confianza;
    (3) con D23A, Caddy responde 404 a POST /api/v1/auth/register (demo cerrada). No hay endpoint de
    métricas (D9C) ni cron mínima (D21B). Los errores usan application/problem+json (RFC 9457).
servers:
  - url: https://{domain}
    variables:
      domain:
        default: demo.example.invalid
        description: Dominio público de la demo (prerrequisito P2 del autor).
security:
  - session: []
paths:
  /api/v1/health/ready:
    get:
      operationId: getReady
      description: >
        Comprobación de salud que usa el despliegue (FR-024) y el healthcheck de Compose. Sin sesión.
        Informa down sin exponer el error de la dependencia (sin cambios de F1).
      security: []
      responses:
        '200': { description: La API y sus dependencias responden. }
        '503': { description: Una dependencia está caída (sin cuerpo con detalles internos). }
  /api/v1/hooks/{triggerId}/{token}:
    post:
      operationId: receiveWebhook
      description: >
        Sin cambios de comportamiento. Solo por TLS en producción; Caddy redacta el segmento {token} en
        sus registros de acceso (FR-003). La API ya lo redacta en los suyos.
      security: []
      parameters:
        - { name: triggerId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Ejecución en cola (sin cambios de F7). }
  /api/v1/auth/register:
    post:
      operationId: register
      description: >
        Sin cambios en la API. Con D23A (demo cerrada) Caddy responde 404 antes de llegar a la API y el
        autor crea las cuentas con un script en la VM. Con D23B, la API responde 404 mientras
        REGISTRATION_ENABLED sea falso.
      security: []
      responses:
        '202': { description: Registro aceptado (sin cambios; no disponible con la demo cerrada). }
        '404': { description: Registro cerrado por el despliegue (D23). }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-session
